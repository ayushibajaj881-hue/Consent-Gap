<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 300px;
        font-family: Arial, sans-serif;
        padding: 16px;
        text-align: left;
      }
      h2 {
        margin: 0 0 8px 0;
        color: #2b2b2b;
        text-align: center;
      }
      textarea {
        width: 100%;
        height: 80px;
        margin-top: 10px;
        font-size: 12px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 6px;
        cursor: pointer;
      }
      #result {
        margin-top: 12px;
        padding: 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
      }
      .safe {
        background: #e3f7e6;
        color: #1a7a34;
      }
      .warning {
        background: #fdeaea;
        color: #b3261e;
      }
      .neutral {
        background: #f1f1f1;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h2 id="message">Checking this page...</h2>
    <ul id="tracker-list" style="font-size: 13px;"></ul>

    <p style="font-size: 12px; margin-bottom: 4px;">
      Paste this site's privacy policy text below, then click Check:
    </p>
    <textarea id="policy-input" placeholder="Paste privacy policy text here..."></textarea>
    <button id="check-button">Check for Consent Gap</button>
    <div id="result"></div>

    <script src="policy-phrases.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
